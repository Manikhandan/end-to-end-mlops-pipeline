apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-pipeline
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: mlops-pipeline}
  template:
    metadata:
      labels: {app: mlops-pipeline}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/example/mlops-pipeline:replace-me
          ports: [{containerPort: 8000, name: http}]
          readinessProbe: {httpGet: {path: /ready, port: http}}
          livenessProbe: {httpGet: {path: /health, port: http}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata: {name: mlops-pipeline}
spec:
  selector: {app: mlops-pipeline}
  ports: [{name: http, port: 80, targetPort: http}]
